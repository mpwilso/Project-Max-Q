<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Max Q"><style>.fly{animation:push 6s cubic-bezier(.45,0,.2,1) infinite}@keyframes push{0%,60%{transform:translate(0,0)}72%,84%{transform:translate(0,-11px)}100%{transform:translate(0,0)}}.flame{transform-box:fill-box;transform-origin:50% 0;animation:burn 6s linear infinite}@keyframes burn{0%,58%{opacity:0;transform:scaleY(.2)}62%{opacity:1;transform:scaleY(1)}66%{transform:scaleY(.65)}70%{transform:scaleY(1)}74%{opacity:1;transform:scaleY(.55)}80%,100%{opacity:0;transform:scaleY(.2)}}@media (prefers-reduced-motion:reduce){.fly,.flame{animation:none}}</style><defs><g id="ms" fill-rule="evenodd"><path d="M0,-50 C7,-42 10,-32 10,-18 L-10,-18 C-10,-32 -7,-42 0,-50 Z"/><path d="M-10,-15 H10 V24 H-10 Z M-4.5,-4 a4.5,4.5 0 1,0 9,0 a4.5,4.5 0 1,0 -9,0 Z"/><path d="M-13,4 L-24,22 V32 L-13,26 Z"/><path d="M13,4 L24,22 V32 L13,26 Z"/><path d="M-6,27 H6 L8,33 H-8 Z"/></g><mask id="mk" maskUnits="userSpaceOnUse" x="-40" y="-40" width="200" height="200"><rect x="-40" y="-40" width="200" height="200" fill="#fff"/><g transform="translate(60 60) rotate(45) translate(0 2) scale(1.12)"><g class="fly"><use href="#ms" fill="#000" stroke="#000" stroke-width="7" stroke-linejoin="round"/></g></g></mask></defs><circle cx="60" cy="60" r="42" fill="none" stroke="#4B9BFF" stroke-width="9" mask="url(#mk)"/><g transform="translate(60 60) rotate(45) translate(0 2) scale(1.12)"><g class="fly"><path class="flame" d="M-6,36 L0,55 L6,36 Z" fill="#FF7F2A" opacity="0"/><use href="#ms" fill="#4B9BFF"/></g></g></svg>
