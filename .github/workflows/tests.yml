name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t .
      - run: python sweep.py --selftest
      - run: python evals/run_fit_eval.py
      - run: python claimcheck.py examples/john_doe/resume.md
      - run: python claimcheck.py --spoken examples/john_doe/stories/
      - run: python claimcheck.py --spoken examples/john_doe/prep/
